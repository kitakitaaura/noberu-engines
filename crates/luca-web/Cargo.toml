[package]
name = "luca-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Browser build of the LUCA System player: PAK indexes, CZ decoding and the script VM for the page to drive."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.126"
luca-pak = { path = "../luca-pak" }
luca-cz = { path = "../luca-cz" }
luca-script = { path = "../luca-script" }
luca-vm = { path = "../luca-vm" }
luca-lbee = { path = "../luca-lbee" }
vfs = { path = "../vfs" }

# No workspace lints: wasm-bindgen's generated glue uses unsafe code.
